<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduViet Embed Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .badge-fhd {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-fhd span {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    .watermark {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0, 59, 149, 0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      pointer-events: none;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .watermark span {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="video-container">
    <div class="watermark">Edu<span>Viet</span> Demo (1.25x)</div>
    <div class="badge-fhd"><span></span> 1080p FHD • 68MB</div>
    <video controls autoplay muted playsinline preload="auto">
      <source src="https://files.catbox.moe/zvh20w.mp4" type="video/mp4">
      Trình duyệt của bạn không hỗ trợ video.
    </video>
  </div>
</body>
</html>
